name: Global research discovery (manual review only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile collectors and triage
        run: python -m py_compile scripts/collect_global.py scripts/triage_global.py
      - name: Offline regression tests
        run: PYTHONPATH=scripts python -m unittest discover -s tests -v
      - name: Collect public source listings (metadata only)
        run: python scripts/collect_global.py
      - name: Produce conservative editorial review queues
        if: success()
        run: python scripts/triage_global.py data/global-review-candidates.json data/global-triage-report.json
      - name: Upload review-only candidate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-research-review-candidates
          path: |
            data/global-review-candidates.json
            data/global-triage-report.json
          if-no-files-found: warn
          retention-days: 7
