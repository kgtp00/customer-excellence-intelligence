name: Collection smoke test (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile collector
        run: python -m py_compile scripts/collect_govuk.py
      - name: Unit tests (offline)
        run: PYTHONPATH=scripts python -m unittest discover -s tests -v
      - name: Fetch and triage public GOV.UK metadata
        run: python scripts/collect_govuk.py
      - name: Upload review queue (not published)
        uses: actions/upload-artifact@v4
        with:
          name: govuk-review-candidates
          path: data/candidates.json
          retention-days: 7
