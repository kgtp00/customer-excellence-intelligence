name: Collection smoke test (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile collector
        run: python -m py_compile scripts/collect_govuk.py
      - name: Fetch public GOV.UK metadata
        run: python scripts/collect_govuk.py
      - name: Upload candidate review file (not published)
        uses: actions/upload-artifact@v4
        with:
          name: govuk-review-candidates
          path: data/candidates.json
          retention-days: 7
